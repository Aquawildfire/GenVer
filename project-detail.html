<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GenVer</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">       
    </head>


    <body>
        <!---=========
        NAV BAR
        =========-->

        <div class="side-bar">
            <div class="nav-container">
                <div class="logo">
                    <img src="logo/logo.png" alt="GenVer_logo" class="logo-icon">
                    <img src="logo/name.png" alt="GenVer_name" class="logo-name">
                    
                </div>
                    <a href="dashboard.html" data-tooltip="Dashboard"><i class="fa-solid fa-tachograph-digital"></i><span class="nav-label"> Dashboard</span></a>
                    <a href="projects.html" class="active" data-tooltip="Projects"><i class="fa-solid fa-diagram-project"></i> <span class="nav-label"> Projects</span></a>
                    <a href="member.html" data-tooltip="Member"><i class="fa-solid fa-people-group"></i> <span class="nav-label"> Member</span></a>
                    <a href="public.html" data-tooltip="Public View"><i class="fa-solid fa-eye"></i> <span class="nav-label"> Public View</span></a>
                    <a href="settings.html" data-tooltip="Settings"><i class="fa-solid fa-gear"></i> <span class="nav-label"> Settings</span></a>
                    
            </div>
            <div class="sidebar-bottom-controls">
                <button id="logout-link"><i class="fa-solid fa-right-from-bracket"></i><span class="nav-label"> Logout</span></button>
                <button id="sidebar-toggle"><i class="fa-solid fa-bars-staggered"></i></button>
            </div>
        </div>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <!---============
            MAIN CONTENT
        ===============-->

        <div class="top-bar">
            <div class="top-container">
                <h3 class="active-nav" id="project-detail-nav-title">Project</h3>

                <div class="profile">
                    <i class="fa-regular fa-bell"></i>
                    <div class="profile-info">
                        <img src="profile/pic.png" alt="">
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">

            <a href="projects.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Projects</a>

            <div id="project-detail-header" class="project-detail-header">
                
            </div>

            <div id="project-announcement-section" class="project-announcement">
                
            </div>

                    <div class="project-detail-layout">
                        <div class="project-detail-main">
                            <div class="section-header-row">
                                <h3 class="section-title">Members</h3>
                                <button id="add-project-member-btn" class="create-btn"><i class="fa-solid fa-plus"></i> Add Member</button>
                            </div>
                            <div id="project-member-table"></div>
                        </div>
                    </div>
                </div>

        <div id="add-project-member-modal" class="modal-overlay">
            <div class="modal-box">
                <h2 class="modal-title">Add Member to Project</h2>

                <form id="add-project-member-form">
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="member-source" value="existing" checked> Existing Member
                        </label>
                        <label>
                            <input type="radio" name="member-source" value="new"> New Member
                        </label>
                    </div>

                    <div id="existing-member-fields">
                        <label for="existing-member-select">Select Member</label>
                        <select id="existing-member-select"></select>
                    </div>

                    <div id="new-member-fields" style="display:none;">
                        <label for="new-member-name">Full Name</label>
                        <input type="text" id="new-member-name">
                    </div>

                    <label for="project-member-amount">Amount Contributed</label>
                    <input type="number" id="project-member-amount" min="0" value="0">

                    <label for="project-member-status">Payment Status</label>
                    <select id="project-member-status">
                        <option value="unpaid">Unpaid</option>
                        <option value="partial">Partial</option>
                        <option value="paid">Paid</option>
                    </select>

                    <div class="modal-actions">
                        <button type="button" id="cancel-project-member-btn" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Add Member</button>
                    </div>
                </form> 
            </div>
        </div> 


        <div id="record-payment-modal" class="modal-overlay">
            <div class="modal-box">
                <h2 class="modal-title">Record Payment</h2>
                <p id="record-payment-member-name" class="record-payment-subtitle"></p>

                <form id="record-payment-form">
                    <label for="payment-amount">Amount Paid (₱)</label>
                    <input type="number" id="payment-amount" min="1" required>

                    <label for="payment-date">Date</label>
                    <input type="date" id="payment-date" required>

                    <div class="modal-actions">
                        <button type="button" id="cancel-payment-btn" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Record Payment</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="auth.js"></script>
        <script>requireLogin();</script>
        <script src="shared.js"></script>
        <script src="dashboard.js"></script>
        <script src="project-detail.js"></script>

        
    </body>
</html>
