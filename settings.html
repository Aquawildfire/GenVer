<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GenVer</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>

        <script src="auth.js"></script>
        <script>requireLogin();</script>

        <div class="side-bar">
            <div class="nav-container">
                <div class="logo">
                    <img src="logo/logo.png" alt="GenVer_logo" class="logo-icon">
                    <img src="logo/name.png" alt="GenVer_name" class="logo-name">
                </div>
                <a href="dashboard.html" data-tooltip="Dashboard"><i class="fa-solid fa-tachograph-digital"></i><span class="nav-label"> Dashboard</span></a>
                <a href="projects.html" data-tooltip="Projects"><i class="fa-solid fa-diagram-project"></i> <span class="nav-label"> Projects</span></a>
                <a href="member.html" data-tooltip="Member"><i class="fa-solid fa-people-group"></i> <span class="nav-label"> Member</span></a>
                <a href="public.html" data-tooltip="Public View"><i class="fa-solid fa-eye"></i> <span class="nav-label"> Public View</span></a>
                <a href="settings.html" class="active" data-tooltip="Settings"><i class="fa-solid fa-gear"></i> <span class="nav-label"> Settings</span></a>
            </div>
            <div class="sidebar-bottom-controls">
                <button id="logout-link"><i class="fa-solid fa-right-from-bracket"></i><span class="nav-label"> Logout</span></button>
                <button id="sidebar-toggle"><i class="fa-solid fa-bars-staggered"></i></button>
            </div>
        </div>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <div class="top-bar">
            <div class="top-container">
                <h3 class="active-nav">Settings</h3>
                <div class="profile">
                    <i class="fa-regular fa-bell"></i>
                    <div class="profile-info">
                        <img src="profile/pic.png" alt="">
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="page-title">Settings</div>

            <div class="settings-card">
                <h3 class="section-title">Account</h3>
                <p class="settings-current-email">Current email: <span id="current-email-display"></span></p>

                <form id="account-settings-form">
                    <label for="current-password">Current Password</label>
                    <input type="password" id="current-password" required>

                    <label for="new-email">New Email (leave blank to keep current)</label>
                    <input type="email" id="new-email">

                    <label for="new-password">New Password (leave blank to keep current)</label>
                    <input type="password" id="new-password">

                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password">

                    <button type="submit" class="btn-primary">Save Changes</button>
                    <p id="settings-message" class="settings-message"></p>
                </form>
            </div>
        </div>

        <script src="shared.js"></script>
        <script src="dashboard.js"></script>
        <script src="settings.js"></script>

    </body>
</html>
