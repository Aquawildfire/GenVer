<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GenVer</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>

        <!---=========
           NAV BAR
          =========-->

        <div class="side-bar">
            <div class="nav-container">
                <div class="logo">
                    <img src="logo/logo.png" alt="GenVer_logo" class="logo-icon">
                    <img src="logo/name.png" alt="GenVer_name" class="logo-name">
                </div>
                    <a href="dashboard.html" class="active" data-tooltip="Dashboard"><i class="fa-solid fa-tachograph-digital"></i><span class="nav-label"> Dashboard</span></a>
                    <a href="projects.html" data-tooltip="Projects"><i class="fa-solid fa-diagram-project"></i> <span class="nav-label"> Projects</span></a>
                    <a href="member.html" data-tooltip="Member"><i class="fa-solid fa-people-group"></i> <span class="nav-label"> Member</span></a>
                    <a href="public.html" data-tooltip="Public View"><i class="fa-solid fa-eye"></i> <span class="nav-label"> Public View</span></a>
                    <a href="settings.html" data-tooltip="Settings"><i class="fa-solid fa-gear"></i> <span class="nav-label"> Settings</span></a>
                
            </div>
            <div class="sidebar-bottom-controls">
                <button id="logout-link"><i class="fa-solid fa-right-from-bracket"></i><span class="nav-label"> Logout</span></button>
                <button id="sidebar-toggle"><i class="fa-solid fa-bars-staggered"></i></button>
            </div>
        </div>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>


        <!---============
            MAIN CONTENT
          ===============-->

        <div class="top-bar">
            <div class="top-container">
                <h3 class="active-nav">Dashboard</h3>

                <div class="profile">
                    <i class="fa-regular fa-bell"></i>
                    <div class="profile-info">
                        <img src="profile/pic.png" alt="">

                    </div>
                </div>
            </div>
        </div>


        <div class="main-content">

            <div class="top-text">
                <h3 class="greetings">Hi, Kent (Admin)</h3>
                <p class="greetings-text">Welcome to fund tracking fund web application</p>
            </div>

            <div class="dashboard-stats">
                <div class="dash-stat-card">
                    <p class="stat-label">Total Funds Collected</p>
                    <h2 class="stat-value">₱0</h2>
                </div>
                <div class="dash-stat-card">
                    <p class="stat-label">Active Projects</p>
                    <h2 class="stat-value">0</h2>
                </div>
                <div class="dash-stat-card">
                    <p class="stat-label">Total Members</p>
                    <h2 class="stat-value">0</h2>
                </div>
                <div class="dash-stat-card">
                    <p class="stat-label">Collection Rate</p>
                    <h2 class="stat-value">0%</h2>
                </div>
            </div>


            <div class="projects-section-dashboard">
                <div class="dashboard-projects-layout">

                    <div class="dashboard-projects-main">
                        <h3 class="section-title">Active Projects</h3>
                        <div class="project-cards" id="dashboard-cards"></div>
                    </div>

                    <div class="activity">
                        <h1 class="activity-log">Activity Log</h1>
                        <div id="dashboard-activity-log" class="recent-activity"></div>
                    </div>
                </div>
            </div>

        </div>

        <script src="auth.js"></script>
        <script>requireLogin();</script>
        <script src="shared.js"></script>
        <script src="dashboard.js"></script>


    </body>
</html>
